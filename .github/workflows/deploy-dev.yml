name: Deploy to Dev VPS

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify required secrets exist
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NUXT_PUBLIC_API_BASE_URL: ${{ secrets.NUXT_PUBLIC_API_BASE_URL }}
          NUXT_PUBLIC_PLATFORM_HOME_URL: ${{ secrets.NUXT_PUBLIC_PLATFORM_HOME_URL }}
          NUXT_PUBLIC_IS_DEMO_MODE: ${{ secrets.NUXT_PUBLIC_IS_DEMO_MODE }}
          NUXT_PUBLIC_DEMO_MAX_PROMPTS: ${{ secrets.NUXT_PUBLIC_DEMO_MAX_PROMPTS }}
          NUXT_PUBLIC_DEMO_MAX_GENERATIONS: ${{ secrets.NUXT_PUBLIC_DEMO_MAX_GENERATIONS }}
          NUXT_PUBLIC_FULL_PLATFORM_URL: ${{ secrets.NUXT_PUBLIC_FULL_PLATFORM_URL }}
          NUXT_PUBLIC_DEMO_GRANT_ID: ${{ secrets.NUXT_PUBLIC_DEMO_GRANT_ID }}
          NUXT_PUBLIC_DEMO_TEMPLATE_ID: ${{ secrets.NUXT_PUBLIC_DEMO_TEMPLATE_ID }}
        run: |
          missing=""
          for secret in DOCKERHUB_USERNAME DOCKERHUB_TOKEN SUPABASE_URL SUPABASE_ANON_KEY NUXT_PUBLIC_API_BASE_URL NUXT_PUBLIC_PLATFORM_HOME_URL NUXT_PUBLIC_IS_DEMO_MODE NUXT_PUBLIC_DEMO_MAX_PROMPTS NUXT_PUBLIC_DEMO_MAX_GENERATIONS NUXT_PUBLIC_FULL_PLATFORM_URL NUXT_PUBLIC_DEMO_GRANT_ID NUXT_PUBLIC_DEMO_TEMPLATE_ID; do
            val="${!secret}"
            if [ -z "$val" ]; then
              missing="$missing $secret"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: tgsa83609327/ai_proposal_demo:dev

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: tgsa83609327/ai_proposal_demo_frontend:dev
          build-args: |
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NUXT_PUBLIC_API_BASE_URL=${{ secrets.NUXT_PUBLIC_API_BASE_URL }}
            NUXT_PUBLIC_PLATFORM_HOME_URL=${{ secrets.NUXT_PUBLIC_PLATFORM_HOME_URL }}
            NUXT_PUBLIC_IS_DEMO_MODE=${{ secrets.NUXT_PUBLIC_IS_DEMO_MODE }}
            NUXT_PUBLIC_DEMO_MAX_PROMPTS=${{ secrets.NUXT_PUBLIC_DEMO_MAX_PROMPTS }}
            NUXT_PUBLIC_DEMO_MAX_GENERATIONS=${{ secrets.NUXT_PUBLIC_DEMO_MAX_GENERATIONS }}
            NUXT_PUBLIC_FULL_PLATFORM_URL=${{ secrets.NUXT_PUBLIC_FULL_PLATFORM_URL }}
            NUXT_PUBLIC_DEMO_GRANT_ID=${{ secrets.NUXT_PUBLIC_DEMO_GRANT_ID }}
            NUXT_PUBLIC_DEMO_TEMPLATE_ID=${{ secrets.NUXT_PUBLIC_DEMO_TEMPLATE_ID }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Dev VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.DEV_VPS_IP }}
          username: root
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            cd /opt/projects/ai-proposal-demo
            git pull origin dev
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose -f docker-compose.beta.yml pull
            docker compose -f docker-compose.beta.yml up -d
            docker image prune -f
