name: Deploy to Live VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: tgsa83609327/ai_proposal_demo:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: tgsa83609327/ai_proposal_demo_frontend:latest
          # Public NUXT_* values are baked at build time. Only the Supabase URL +
          # anon key are secrets; the rest are fixed prod values. The frontend
          # talks to its own backend same-origin, so API base is empty (-> /api).
          build-args: |
            SUPABASE_URL=${{ secrets.LIVE_SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.LIVE_SUPABASE_ANON_KEY }}
            NUXT_PUBLIC_API_BASE_URL=
            NUXT_PUBLIC_PLATFORM_HOME_URL=https://aiproposal.tgsa.com.tw/api/external-auth/redirect
            NUXT_PUBLIC_FULL_PLATFORM_URL=https://aiproposal.tgsa.com.tw
            NUXT_PUBLIC_IS_DEMO_MODE=true
            NUXT_PUBLIC_DEMO_MAX_PROMPTS=3
            NUXT_PUBLIC_DEMO_MAX_GENERATIONS=99999
            NUXT_PUBLIC_DEMO_GRANT_ID=local
            NUXT_PUBLIC_DEMO_TEMPLATE_ID=universal_SBIR

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets GitHub prove its identity to Google (no stored GCP key)
    env:
      # Not secrets: identifiers only. Access is enforced by the WIF provider's
      # condition (this repo, refs/heads/main) and the SA's IAM roles.
      GCP_PROJECT: gen-lang-client-0184781873
      GCP_ZONE: asia-east1-c
      GCP_VM: ai-proposal-production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/490245625700/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: gh-deploy@gen-lang-client-0184781873.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # SSH goes through Google IAP instead of the VM's public port 22, which is
      # closed to the internet (ISO 27001 minimal access). Same key and user as before.
      - name: SSH into Live VPS (via IAP) and Deploy
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SSH_KEY: ${{ secrets.LIVE_VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Docker Hub creds go over stdin, not the remote command line, so they
          # don't show up in the VM's process list.
          {
            printf 'export DOCKERHUB_USERNAME=%q DOCKERHUB_TOKEN=%q\n' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN"
            cat <<'EOF'
          cd /var/www/demo
          git pull origin main
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f
          EOF
          } | ssh -i ~/.ssh/deploy_key \
                -o StrictHostKeyChecking=accept-new \
                -o ServerAliveInterval=30 \
                -o ProxyCommand="gcloud compute start-iap-tunnel $GCP_VM 22 --listen-on-stdin --project=$GCP_PROJECT --zone=$GCP_ZONE --verbosity=warning" \
                "cm@$GCP_VM" 'bash -s'
