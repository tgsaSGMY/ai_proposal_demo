version: "3.8"

# For multi-deployment on the same host (same Docker daemon), remove container_name
# and use: docker compose -p <project_name> -f docker-compose.beta.yml up -d
# Example:
#   docker compose -p demo-sbir -f docker-compose.beta.yml up -d
#   docker compose -p demo-sbir-p1 -f docker-compose.beta.yml up -d
#
# For single-deployment-per-VPS (our case), container_name is fine and makes
# debugging / proxying easier.

services:
  fastapi-backend:
    container_name: demo-sbir-backend
    image: tgsa83609327/ai_proposal_demo:dev
    restart: always
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - supabase_net
      - npm-network

  nuxt-frontend:
    container_name: demo-sbir-frontend
    # Use the pre-built dev image from Docker Hub instead of building on the VPS
    image: tgsa83609327/ai_proposal_demo_frontend:dev
    restart: always
    env_file:
      - ./frontend/.env
    depends_on:
      - fastapi-backend
    networks:
      - default
      - npm-network

# Notice we completely removed the nginx-proxy service here
# because Nginx Proxy Manager (NPM) will handle all routing globally on the VPS.
# Each deployment must be added as a separate "Proxy Host" in NPM pointing
# to the container_name values below: demo-sbir-backend and demo-sbir-frontend.
#
# For other templates (STTR, P1, etc.) on their own VPS, change the prefix
# in container_name to avoid network alias collisions (e.g. demo-sttr-backend).

networks:
  supabase_net:
    external: true
    name: supabase_default
  npm-network:
    external: true
