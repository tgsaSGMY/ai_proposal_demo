version: "3.8"

services:
  fastapi-backend:
    image: jianheng0831/ai_proposal_platform:latest
    container_name: fastapi_server
    restart: always
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - supabase_net

  nuxt-frontend:
    build: ./frontend
    container_name: nuxt_client
    restart: always
    env_file:
      - ./frontend/.env
    depends_on:
      - fastapi-backend

  nginx-proxy:
    image: jianheng0831/ai_proposal_nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 掛載證書 (左邊是主機路徑 : 右邊是容器路徑)
      - /srv/nginx/certs:/etc/nginx/certs:ro
      # 掛載設定檔
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - fastapi-backend
      - nuxt-frontend
    networks:
      - default
      - supabase_net

networks:
  supabase_net:
    external: true
    name: supabase_default
