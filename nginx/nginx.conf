events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 1. 定義後端 (FastAPI)
    # 你說後端是 8080，如果你的容器內部真的是 8080 請用這個；
    # 但通常 FastAPI 預設是 8000。請確保 fastapi_server 容器內部真的有開 8080。
    # 這裡我先寫 fastapi_server:8000 (因為 docker 內部通常沒變)，若連不上後端再改 8080。
    upstream backend_server {
        server fastapi_server:8000; 
    }

    # 2. 定義前端
    upstream frontend_server {
        server nuxt_client:3000;
    }

    # 3. [新增] 定義 Supabase
    # 這裡直接指向你的 IP 和 Port
    upstream supabase_server {
        server supabase-kong:8000;
    }

    server {
        listen 80;
        server_name aiproposal.tgsa.com.tw;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name aiproposal.tgsa.com.tw;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # --- A. 前端頁面 ---
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- B. Supabase 轉發 (關鍵修正) ---
        # 讓 https://你的域名/supabase/xxx -> 轉發到 http://IP:8000/xxx
        location /supabase/ {
            # 注意：這裡結尾有斜線 /，代表把 /supabase/ 這段路徑去掉後再轉發
            proxy_pass http://supabase_server/; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 支援 (Supabase Realtime 需要)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- C. 後端 API ---
        location /api/ {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 120s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}