events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker 內建 DNS。搭配下方 proxy_pass 使用變數，nginx 會在執行期重新解析容器名稱，
    # 快取 10 秒。若不加這段，nginx 只在「啟動時」解析一次並永久快取該 IP；
    # 之後只要 docker 重建容器拿到新 IP，nginx 仍會把流量送往舊 IP
    # （該 IP 可能已被別的容器占用 → 出現看似「路由不存在」的 404）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 註：後端 (fastapi_server:8000) 與前端 (nuxt_client:3000) 不再使用 upstream 區塊，
    # 改為在各自的 location 內以變數指定（見下方 set $backend_upstream / $frontend_upstream）。
    # 好處有二：
    #   (1) 容器重建換 IP 後 nginx 會自動跟上，不需要 restart nginx；
    #   (2) nginx 啟動時不再強制解析這些容器名稱，後端沒起來時 nginx 仍能正常啟動。

    # 定義 Supabase
    # 這裡直接指向你的 IP 和 Port
    # 註：此處 proxy_pass 帶有路徑改寫（結尾斜線），改用變數需額外加 rewrite 才等價，
    # 且 supabase-kong 屬長駐服務、不隨應用部署重建，故維持 upstream 寫法。
    upstream supabase_server {
        server supabase-kong:8000;
    }

    server {
        listen 80;
        server_name aiproposal.tgsa.com.tw;

        # Let's Encrypt ACME challenge (must be served over HTTP, not redirected to HTTPS)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name aiproposal.tgsa.com.tw;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # --- A. 前端頁面 ---
        location / {
            set $frontend_upstream nuxt_client:3000;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- B. Supabase 轉發 (關鍵修正) ---
        # 讓 https://你的域名/supabase/xxx -> 轉發到 http://IP:8000/xxx
        location /supabase/ {
            # 注意：這裡結尾有斜線 /，代表把 /supabase/ 這段路徑去掉後再轉發
            proxy_pass http://supabase_server/; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 支援 (Supabase Realtime 需要)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- C. 後端 API ---
        location /api/ {
            set $backend_upstream fastapi_server:8000;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 120s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        location /auth/v1/ {
            proxy_pass http://supabase_server/auth/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ===== AI Proposal DEMO (usbir-demo.tgsa.com.tw) =====
    # 同上，demo 前後端改為在 location 內以變數指定，不再使用 upstream 區塊。

    server {
        listen 80;
        server_name usbir-demo.tgsa.com.tw;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name usbir-demo.tgsa.com.tw;

        ssl_certificate     /etc/nginx/certs/usbir-demo.fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/usbir-demo.privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            set $demo_frontend_upstream demo-usbir-frontend:3000;
            proxy_pass http://$demo_frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /supabase/ {
            proxy_pass http://supabase_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/ {
            set $demo_backend_upstream fastapi_demo_server:8000;
            proxy_pass http://$demo_backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 120s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }

}
